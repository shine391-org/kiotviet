# Docker Compose Staging - Production-like Environment
# Extends docker-compose.yml with staging configs
# Usage: docker-compose -f docker-compose.yml -f docker-compose.staging.yml up -d

services:
  web:
    volumes:
      - ./backend-ci/app:/var/www/html/app:ro
      - ./backend-ci/public:/var/www/html/public:ro
      - ./backend-ci/spark:/var/www/html/spark:ro
      - ./backend-ci/env:/var/www/html/env:ro
      - backend_vendor:/var/www/html/vendor
      - staging_uploads:/var/www/html/uploads
      - staging_writable:/var/www/html/writable
    environment:
      - CI_ENVIRONMENT=staging
      - LOG_THRESHOLD=2
      - DB_NAME=${DB_DATABASE:-lanocrm_staging}

  fe:
    build:
      context: ./lanocrm
      dockerfile: Dockerfile.prod
    ports:
      - "${STAGING_FE_PORT:-80}:80"
    environment:
      - NODE_ENV=staging
      - VITE_API_BASE_URL=/api
    command: ["nginx", "-g", "daemon off;"]

  db:
    volumes:
      - db_staging_data:/var/lib/mysql
      - ./backups/mysql:/backups:rw
      - ./backend-ci/docker/mysql/custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-lanocrm_staging}
    ports:
      - "${STAGING_DB_PORT:-3308}:3306"

  db-test:
    ports:
      - "${STAGING_DB_TEST_PORT:-3309}:3306"

  phpmyadmin:
    ports:
      - "${STAGING_PMA_PORT:-8081}:80"

volumes:
  staging_uploads:
  staging_writable:
  db_staging_data:
