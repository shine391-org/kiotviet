# Docker Compose Dev - Development Environment
# Extends docker-compose.yml with dev-specific configs
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  web:
    volumes:
      - ./backend-ci:/var/www/html
      - ./backend-ci/docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - backend_vendor:/var/www/html/vendor
      - backend_writable:/var/www/html/writable
    environment:
      - CI_ENVIRONMENT=development
      - LOG_THRESHOLD=4

  fe:
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    environment:
      - NODE_ENV=development

  db:
    environment:
      - MYSQL_SLOW_QUERY_LOG=1
      - MYSQL_LONG_QUERY_TIME=2

volumes:
  backend_writable:
