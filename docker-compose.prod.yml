# Docker Compose for Production Environment
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: '3.8'

services:
  api:
    volumes:
      # Production volume mapping (read-only source code)
      - ./backend-ci:/var/www/html:ro
      # Writable directories only
      - api_uploads:/var/www/html/uploads
      - api_writable:/var/www/html/writable
      - api_logs:/var/log/apache2
    environment:
      # Production environment
      - CI_ENVIRONMENT=production
      - LOG_THRESHOLD=1
    # Remove development overrides
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  fe:
    volumes:
      # Production volume mapping (read-only source code)
      - ./lanocrm:/app:ro
      # Writable directories only
      - fe_build:/app/dist
      - fe_logs:/var/log/nginx
    environment:
      # Production environment
      - NODE_ENV=production
    # Remove development overrides
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  db:
    volumes:
      # Production database volume with backup
      - db_data:/var/lib/mysql
      - ./backups/mysql:/backups
      - ./backend-ci/docker/mysql/custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
    environment:
      # Production MySQL settings
      - MYSQL_INNODB_BUFFER_POOL_SIZE=2G
      - MYSQL_INNODB_LOG_FILE_SIZE=512M
      - MYSQL_MAX_CONNECTIONS=500
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  db-test:
    # Remove test database in production
    profiles:
      - disabled

  phpmyadmin:
    # Remove phpMyAdmin in production
    profiles:
      - disabled

volumes:
  # Production-specific volumes
  api_uploads:
    driver: local
  api_writable:
    driver: local
  api_logs:
    driver: local
  fe_build:
    driver: local
  fe_logs:
    driver: local
