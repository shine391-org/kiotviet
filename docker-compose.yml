version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: backend-ci/Dockerfile
    command: [ "bash", "/var/www/html/docker-start.sh" ]
    ports:
      - "8000:80"
    env_file:
      - backend-ci/.env
    depends_on:
      - db
    volumes:
      # Nếu source code ở Dev Drive F:
      - F:/projects/lanocrm/backend-ci:/var/www/html
      # Hoặc giữ relative path nếu docker-compose.yml đã ở F:
      - ./backend-ci:/var/www/html

  fe:
    build:
      context: ./lanocrm
      dockerfile: Dockerfile
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://api
    depends_on:
      - api
    volumes:
      # Nếu ở Dev Drive
      - F:/projects/lanocrm/lanocrm:/app
      # Hoặc relative
      - ./lanocrm:/app
      # node_modules nên dùng named volume (QUAN TRỌNG)
      - node_modules_cache:/app/node_modules

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: lanocrm_shop
      MYSQL_USER: lanocrm_user
      MYSQL_PASSWORD: KP7n4RjcDbedSE2W8GgA
    volumes:
      # Named volumes tự động dùng Docker data root (đã config ở F:)
      - db_data:/var/lib/mysql
      - ./backend-ci/docker/mysql/custom.cnf:/etc/mysql/conf.d/custom.cnf:ro

  db-test:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: lanocrm_test
      MYSQL_USER: lanocrm_user
      MYSQL_PASSWORD: KP7n4RjcDbedSE2W8GgA
    volumes:
      - test_db_data:/var/lib/mysql
      - ./backend-ci/docker/mysql/custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
    ports:
      - "3307:3306"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOSTS: db,db-test
      PMA_USER: lanocrm_user
      PMA_PASSWORD: KP7n4RjcDbedSE2W8GgA
    ports:
      - "8080:80"
    depends_on:
      - db
      - db-test

volumes:
  db_data:
  test_db_data:
  node_modules_cache: # Thêm volume này cho node_modules
