services:
  web:
    build:
      context: .
      dockerfile: backend-ci/Dockerfile
    ports:
      - "${APP_PORT:-8000}:80"
    env_file:
      - backend-ci/.env
    environment:
      - CI_ENVIRONMENT=development
      - DB_HOST=db
      - DB_NAME=${DB_DATABASE:-lanocrm_dev}
      - DB_USER=${DB_USER:-lanocrm_user}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./backend-ci:/var/www/html
      - ./backend-ci/docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      # Isolate vendor to avoid permission issues
      - backend_vendor:/var/www/html/vendor
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  fe:
    build:
      context: ./lanocrm
      dockerfile: Dockerfile
    ports:
      - "${FE_PORT:-3000}:3000"
    environment:
      - VITE_API_URL=http://web
      - NODE_ENV=development
    depends_on:
      - web
    volumes:
      - ./lanocrm:/app
      - node_modules_cache:/app/node_modules
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-lanocrm_dev}
      MYSQL_USER: ${DB_USER:-lanocrm_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - db_data:/var/lib/mysql
      - ./backend-ci/docker/mysql/custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${DB_MEMORY_LIMIT:-1G}
        reservations:
          memory: 512M

  db-test:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_TEST_DATABASE:-lanocrm_test}
      MYSQL_USER: ${DB_USER:-lanocrm_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - test_db_data:/var/lib/mysql
      - ./backend-ci/docker/mysql/custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
    ports:
      - "${DB_TEST_PORT:-3307}:3306"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${DB_MEMORY_LIMIT:-1G}
        reservations:
          memory: 256M

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOSTS: db,db-test
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "${PMA_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy
      db-test:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
  test_db_data:
  node_modules_cache:
  backend_vendor:
