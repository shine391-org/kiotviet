version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: backend-ci/Dockerfile
    ports:
      - "8000:80"
    env_file:
      - backend-ci/.env
    depends_on:
      - db

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: lanocrm_shop
      MYSQL_USER: lanocrm_user
      MYSQL_PASSWORD: KP7n4RjcDbedSE2W8GgA
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
